name: Build and deploy site
# main에 원고가 올라오면 생성물을 만들고 검사한 뒤
# 1) 생성물(notes.json, index.html, robots.txt, AI 색인, llms.txt)을 main에 자동 커밋하고
# 2) 같은 결과물로 GitHub Pages를 배포한다.
# 처음 한 번: Settings → Pages → Source를 "GitHub Actions"로 바꾼다.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate
        run: node scripts/build.mjs
      - name: Validate
        run: node scripts/build.mjs --check
      - name: Commit regenerated files to main
        run: |
          git add -A notes.json index.html robots.txt AI_INDEX.md ai llms.txt
          if git diff --cached --quiet; then
            echo "Generated files already up to date."
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main moved on; the run for the newer commit will regenerate."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate site data and AI index"
          git push origin HEAD:main
      - name: Assemble site
        run: |
          mkdir _site
          tar --exclude=./.git --exclude=./.github --exclude=./_site -cf - . | tar -xf - -C _site
      - name: Build static pages and sitemap
        run: node scripts/build-static.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
