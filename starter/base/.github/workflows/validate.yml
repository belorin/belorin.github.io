name: Validate wiki
# main 밖의 브랜치와 PR에서 원고·설정·사이트를 검사한다(배포는 deploy-pages.yml).
on:
  push:
    branches-ignore: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/build.mjs
      - run: node scripts/build.mjs --check
      - run: node scripts/build-static.mjs "$RUNNER_TEMP/site"
