<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>광주·전남 공연예술인 아카이브</title><style>
:root{color-scheme:light dark;--bg:light-dark(#f6f5f1,#171a1d);--panel:light-dark(#fff,#22272a);--line:light-dark(#deddd5,#394146);--ink:light-dark(#202822,#e8ece7);--muted:light-dark(#596660,#adbab2);--accent:light-dark(#226b59,#90cbb8)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,sans-serif}main{max-width:1100px;padding:24px;margin:auto}a{color:var(--accent)}h1{font-size:clamp(24px,4vw,38px);margin:10px 0}p{margin:4px 0 14px;color:var(--muted)}.metrics,.controls{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.metric{flex:1;min-width:120px;background:var(--panel);border:1px solid var(--line);padding:12px;border-radius:8px}.metric strong{display:block;font-size:24px}.controls label{flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px}.controls label:first-child{flex:2;min-width:220px}input,select{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px;border-radius:6px;min-width:0}section{margin-top:26px}.table{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:13px}button{font:inherit;color:var(--accent);background:none;border:0;text-decoration:underline;cursor:pointer;padding:0}.muted{color:var(--muted)}details{margin:12px 0}footer{margin:30px 0;color:var(--muted)} </style></head>
<body><main><a href="../">← 열린 노트</a><h1>광주·전남 공연예술인 아카이브</h1><p>프로그램북을 통해 읽는 지역 공연예술계의 공연과 사람. 이름이 같아도 동일인으로 확정하지 않습니다.</p><div id="metrics" class="metrics"></div><div class="controls"><label>이름·파트·배역·공연 검색<input id="q" placeholder="예: 박채빈, 비올라, 베토벤"></label><label>단체<select id="ensemble"><option value="">전체</option></select></label><label>공연·시즌<select id="scope"><option value="">전체</option></select></label><label>분류<select id="category"><option value="">전체</option><option value="instrumentalist">관현악</option><option value="chorister">합창</option><option value="leadership">지휘부 직책</option><option value="accompanist">반주자</option><option value="dancer">무용·발레</option><option value="actor">연극·연기</option><option value="stage_crew">무대 제작</option><option value="staff">운영 인력</option></select></label></div><p id="status" role="status">데이터를 읽는 중…</p><section><h2>명부 검색 결과</h2><div class="table"><table><thead><tr><th>이름</th><th>파트·배역</th><th>직책</th><th>단체</th><th>공연·시즌</th><th>출처 / 검수</th></tr></thead><tbody id="rows"></tbody></table></div></section><section><h2>인물 연결과 단체 관계망</h2><p>이름·악기 계열의 일치는 가설입니다. 제1·제2바이올린과 팀파니·타악기는 같은 계열로 비교하되 원본 파트는 유지합니다. 확인 모드는 근거로 승인된 직접 연결만 사용합니다.</p><label>연결 기준 <select id="identity-mode"><option value="possible">추정 이상</option><option value="likely">유력 이상</option><option value="confirmed">확인만</option></select></label><div id="identity-network"></div><h3>인물 활동 이력 후보</h3><input id="identity-q" placeholder="이름 검색" aria-label="인물 활동 이력 후보 검색"><div id="matches"></div></section><footer><a href="../#gwangju-symphony-roster">광주시향 원고</a> · <a href="../#camerata-jeonnam-roster">카메라타전남 원고</a> · <a href="data/catalog.json">JSON 색인</a></footer></main><script type="module" src="app.js?v=7"></script></body></html>
