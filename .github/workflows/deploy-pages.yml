name: Build and deploy site
# main에 원고(wiki/*.md, manifest, 장부)가 올라오면 생성물을 만들고 검증한 뒤
# 1) 생성물(notes.json, AI 색인, llms.txt)을 main에 자동 커밋하고
# 2) 같은 결과물로 GitHub Pages를 배포한다.
# GITHUB_TOKEN으로 만든 자동 커밋은 워크플로를 다시 촉발하지 않으므로 반복되지 않는다.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate site data and AI indexes
        run: |
          node scripts/build-notes.mjs
          node scripts/build-ai-index.mjs
      - name: Validate
        run: |
          node scripts/build-notes.mjs --check
          node scripts/build-ai-index.mjs --check
          node scripts/validate-editorial.mjs
          node scripts/test-editorial.mjs
          node scripts/validate-crosslinks.mjs
          node scripts/test-crosslinks.mjs
          node --check app.js
          node scripts/test-viewer.mjs
      - name: Commit regenerated files to main
        run: |
          git add notes.json AI_INDEX.md ai llms.txt
          if git diff --cached --quiet; then
            echo "Generated files already up to date."
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main moved on; the run for the newer commit will regenerate."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate site data and AI indexes"
          git push origin HEAD:main
      - name: Assemble site
        run: |
          mkdir _site
          tar --exclude=./.git --exclude=./.github --exclude=./_site -cf - . | tar -xf - -C _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
